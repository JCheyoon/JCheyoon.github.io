# LinkedIn 액세스 토큰(60일 만료) 갱신 알림 (SPEC §9.3). 만료 2주 전부터 이슈를 1개 만든다.
# 저장소 변수 LINKEDIN_TOKEN_ISSUED_AT(YYYY-MM-DD)이 없으면 아무것도 하지 않는다.
name: LinkedIn token

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  remind:
    name: 토큰 만료 확인
    runs-on: ubuntu-latest
    steps:
      - env:
          ISSUED_AT: ${{ vars.LINKEDIN_TOKEN_ISSUED_AT }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$ISSUED_AT" ]; then echo "발급일이 없다"; exit 0; fi
          days=$(( ($(date -u +%s) - $(date -u -d "$ISSUED_AT" +%s)) / 86400 ))
          echo "발급 후 ${days}일"
          if [ "$days" -lt 46 ]; then exit 0; fi
          title="LinkedIn 토큰 갱신 필요 (발급일 $ISSUED_AT)"
          # 닫은 이슈도 센다. 같은 토큰의 알림을 다시 만들지 않는다
          count=$(gh issue list --state all --limit 100 --json title --jq "map(select(.title == \"$title\")) | length")
          if [ "$count" != "0" ]; then exit 0; fi
          gh issue create --title "$title" --body "LinkedIn 액세스 토큰은 발급 60일 뒤 만료됩니다.

          1. https://www.linkedin.com/developers/tools/oauth/token-generator 에서 openid, profile, w_member_social로 다시 발급합니다.
          2. Settings → Secrets and variables → Actions에서 Secret LINKEDIN_ACCESS_TOKEN을 바꿉니다.
          3. 같은 화면의 Variable LINKEDIN_TOKEN_ISSUED_AT을 오늘 날짜로 바꿉니다."
